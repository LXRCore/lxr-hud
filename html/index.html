<!DOCTYPE html>
<!-- LXR-HUD | LXR UI Kit | © 2026 iBoss21 / LXRCore | lxrcore.com -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HUD</title>
  <link rel="stylesheet" href="lxr-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="lxr">
  <div id="hud" class="hud lxr-hidden">

    <!-- top-left: brand -->
    <div class="hud-brand"><img src="img/lxrcore-logo.png" alt=""><span class="lxr-mono" id="brand-name"></span></div>

    <!-- top-centre: compass -->
    <div class="hud-compass" id="compass">
      <div class="hud-compass__strip"><div class="hud-compass__tape" id="tape"></div><div class="hud-compass__needle"></div></div>
      <div class="hud-compass__place"><span class="lxr-mono" id="heading">000</span><span class="hud-compass__name" id="place"></span></div>
    </div>

    <!-- top-right: clock, identity, money -->
    <div class="hud-right">
      <div class="hud-chips" id="clock-row"><span class="hud-chip lxr-mono" id="date"></span><span class="hud-chip lxr-mono" id="time"></span></div>
      <div class="hud-id" id="identity"><span class="hud-id__name" id="name"></span><span class="hud-chip hud-chip--job lxr-mono" id="job"></span></div>
      <div class="hud-money" id="money"><span class="hud-money__cash lxr-num">$<span id="cash">0</span></span><span class="hud-money__bank lxr-mono"><span data-l="bank"></span> $<span id="bank">0</span></span></div>
    </div>

    <!-- bottom-left: status row -->
    <div class="hud-status" id="status"></div>

    <!-- bottom-right: weapon + mount -->
    <div class="hud-right-b">
      <div class="hud-mount lxr-hidden" id="mount">
        <div class="hud-mount__speed"><span class="lxr-num" id="speed">0</span><span class="lxr-mono" id="unit">mph</span></div>
        <div class="hud-mount__cores" id="mount-cores"><div class="hud-core"><span class="lxr-mono" data-l="horse_health"></span><div class="lxr-meter"><div class="lxr-meter-fill" id="m-health"></div></div></div><div class="hud-core"><span class="lxr-mono" data-l="horse_stamina"></span><div class="lxr-meter"><div class="lxr-meter-fill" id="m-stamina"></div></div></div></div>
      </div>
      <div class="hud-weapon lxr-hidden" id="weapon"><span class="hud-weapon__name" id="w-name"></span><span class="hud-weapon__ammo lxr-num" id="w-ammo"></span></div>
    </div>
  </div>

  <!-- settings -->
  <div id="settings" class="hud-settings lxr-hidden">
    <div class="hud-settings__box lxr-hit">
      <div class="hud-settings__head"><div><span class="lxr-mono lxr-t-ash" data-l="settings_eyebrow"></span><h2 class="lxr-cut" data-l="settings_title"></h2></div><button class="lxr-btn lxr-btn-ghost lxr-btn-sm" id="s-close" data-l="close"></button></div>
      <label class="hud-set"><span data-l="opacity"></span><input type="range" min="0.3" max="1" step="0.05" data-s="opacity"></label>
      <label class="hud-set hud-set--row"><span data-l="show_compass"></span><input type="checkbox" data-s="compass"></label>
      <label class="hud-set hud-set--row"><span data-l="show_status"></span><input type="checkbox" data-s="status"></label>
      <label class="hud-set hud-set--row"><span data-l="show_weapon"></span><input type="checkbox" data-s="weapon"></label>
      <label class="hud-set hud-set--row"><span data-l="show_mount"></span><input type="checkbox" data-s="mount"></label>
      <div class="hud-set"><span data-l="minimap"></span><div class="hud-seg"><button class="lxr-chip" data-mm="radar" data-l="minimap_radar"></button><button class="lxr-chip" data-mm="off" data-l="minimap_off"></button></div></div>
      <div class="hud-settings__foot"><button class="lxr-btn" id="s-save" data-l="save"></button></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
